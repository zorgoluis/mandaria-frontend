server_tokens off;

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Public Swagger switch: change ONLY the matching value 1 (blocked) to 0 (public).
map $uri $block_public_swagger {
    default 0;
    ~*^/(?:api/v1/)?docs 1;
}

ssl_certificate     /etc/letsencrypt/live/mandaria.com.mx/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/mandaria.com.mx/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

client_max_body_size 10M;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mandaria.com.mx;

    if ($block_public_swagger) { return 404; }

    location /api/ {
        set $api http://backend:3000;
        proxy_pass $api;
    }

    location = /health {
        set $api http://backend:3000;
        proxy_pass $api;
    }

    location ~ ^/(developers|login)(/.*)?$ {
        return 301 https://app.mandaria.com.mx$request_uri;
    }

    location / {
        set $up http://landing:80;
        proxy_pass $up;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.mandaria.com.mx;
    return 301 https://mandaria.com.mx$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.mandaria.com.mx;

    set $up http://frontend:80;
    location / { proxy_pass $up; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.mandaria.com.mx;

    if ($block_public_swagger) { return 404; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    set $up http://backend:3000;

    location /socket.io/ {
        proxy_pass $up;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / { proxy_pass $up; }
}