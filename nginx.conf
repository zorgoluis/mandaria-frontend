# Loaded inside nginx's http context by conf.d/default.conf.
# Public Swagger switch: change ONLY the matching value 1 (blocked) to 0 (public).
# Match normalized URI, not query parameters, cookies or browser state.
map $uri $block_public_swagger {
    default 0;
    ~*^/(?:api/v1/)?docs 1;
}

server {
    listen 80;
    server_name mandaria.com.mx;

    if ($block_public_swagger) { return 404; }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://mandaria.com.mx$request_uri;
    }
}

server {
  listen 443 ssl;
  server_name mandaria.com.mx;

  if ($block_public_swagger) { return 404; }

  ssl_certificate /etc/letsencrypt/live/mandaria.com.mx/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mandaria.com.mx/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: http:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://backend:3000;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /docs {
    proxy_pass http://backend:3000;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://backend:3000;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Public documentation files must never fall back to index.html.
  location ^~ /developers/assets/ {
    types {
      application/json json;
      text/plain md mjs;
    }
    default_type application/octet-stream;
    try_files $uri =404;
    expires -1;
  }

  # JSON is published only under the reviewed assets directory.
  location ~ ^/developers/.*\.json$ {
    default_type application/json;
    return 404 '{"error":"Not found"}';
  }

  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }
}
