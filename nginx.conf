# Loaded inside nginx's http context by conf.d/default.conf.
# Servidor interno de la app web: TLS, dominios y /api los resuelve mandaria-proxy.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # SPA entry points must not resolve the physical developers assets directory.
  location = /developers {
    try_files /index.html =404;
    expires -1;
  }

  location = /developers/ {
    try_files /index.html =404;
    expires -1;
  }

  # Public documentation files must never fall back to index.html.
  location ^~ /developers/assets/ {
    types {
      application/json json;
      text/plain md mjs;
    }
    default_type application/octet-stream;
    try_files $uri =404;
    expires -1;
  }

  # JSON is published only under the reviewed assets directory.
  location ~ ^/developers/.*\.json$ {
    default_type application/json;
    return 404 '{"error":"Not found"}';
  }

  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }
}